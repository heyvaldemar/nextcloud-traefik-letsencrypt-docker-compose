name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly rebuild to catch upstream image drift (new Traefik, Nextcloud,
    # Redis, or Postgres releases that break deployment).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trivy findings don't block the pipeline — they surface in the Security
    # tab where they can be triaged and fixed via pin bumps.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: postgres
            env_var: NEXTCLOUD_POSTGRES_IMAGE_TAG
            # Known-noise paths in the official postgres image, neither
            # actionable from this repo: gosu (Go-stdlib CVEs fixed only by
            # upstream rebuilds) and Debian's placeholder snakeoil key
            # (secret-scanner false positive).
            skip_files: "usr/local/bin/gosu,/usr/local/bin/gosu,etc/ssl/private/ssl-cert-snakeoil.key,/etc/ssl/private/ssl-cert-snakeoil.key"
          - name: redis
            env_var: NEXTCLOUD_REDIS_IMAGE_TAG
          - name: traefik
            env_var: TRAEFIK_IMAGE_TAG
          - name: nextcloud
            env_var: NEXTCLOUD_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" nextcloud-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-files: ${{ matrix.skip_files }}

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scheduled + manual dispatch only: a new upstream release is not
    # actionable inside an unrelated PR. On the cron the failure lands as a
    # workflow-failure notification to the maintainer — a stale pin must
    # not sit unnoticed. Dependabot cannot see these pins (they are compose
    # interpolation defaults, not Dockerfile literals), so this job is the
    # actual tracking mechanism.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          for var in TRAEFIK_IMAGE_TAG NEXTCLOUD_POSTGRES_IMAGE_TAG NEXTCLOUD_REDIS_IMAGE_TAG NEXTCLOUD_IMAGE_TAG; do
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" nextcloud-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this empty,
            # and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              continue
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"

      - name: Compare pinned Nextcloud version against the latest release
        run: |
          pin="$(grep -m1 -oE '\$\{NEXTCLOUD_IMAGE_TAG:-.*' nextcloud-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned_version="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/nextcloud/server/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest Nextcloud release from the GitHub API"
            exit 1
          fi
          if [ "$pinned_version" != "$latest" ]; then
            echo "::error::Nextcloud pin is behind: pinned ${pinned_version}, latest release is ${latest}"
            exit 1
          fi
          echo "Nextcloud pin ${pinned_version} matches the latest release"

      - name: Compare pinned Traefik minor against the latest release
        run: |
          pin="$(grep -m1 -oE '\$\{TRAEFIK_IMAGE_TAG:-.*' nextcloud-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned_minor="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/traefik/traefik/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest Traefik release from the GitHub API"
            exit 1
          fi
          case "$latest" in
            "$pinned_minor".*)
              echo "Traefik pin ${pinned_minor} matches the latest release line (${latest})"
              ;;
            *)
              echo "::error::Traefik pin is behind: pinned minor ${pinned_minor}, latest release is ${latest}"
              exit 1
              ;;
          esac

  deploy-and-test:
    name: docker compose up + Nextcloud install + HTTPS smoke
    runs-on: ubuntu-latest
    # Wait for lint so we don't burn the compose-up slot on a workflow with
    # shellcheck/actionlint errors. scan-trivy runs in parallel.
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      NETWORK_ONE: nextcloud-network
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: nextcloud-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: nextcloud.heyvaldemar.net
      APP_TRAEFIK_HOSTNAME: traefik.nextcloud.heyvaldemar.net
      COMPOSE_PROJECT_NAME: nextcloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create necessary Docker networks
        run: |
          docker network create "$NETWORK_ONE" || true
          docker network create "$NETWORK_TWO" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          NEXTCLOUD_DB_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          NEXTCLOUD_REDIS_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          NEXTCLOUD_ADMIN_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
          NEXTCLOUD_HOSTNAME=${APP_HOSTNAME}
          NEXTCLOUD_URL=https://${APP_HOSTNAME}
          BACKUP_INIT_SLEEP=15s
          BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts

      - name: Print Docker Compose services status
        run: docker ps

      - name: Wait for Nextcloud to finish installing (status.php via Traefik)
        # First boot runs the full Nextcloud installer against Postgres —
        # `"installed":true` in status.php is the definitive signal that the
        # shipped configuration produces a working instance, not just a
        # container that starts.
        run: |
          echo "Waiting for status.php to report installed:true..."
          # $APP_HOSTNAME is intentionally expanded by the inner bash -c
          # (which inherits the job-level env:), not by the outer shell.
          # shellcheck disable=SC2016
          timeout 10m bash -c 'while ! curl -fsk "https://$APP_HOSTNAME/status.php" | grep -q "\"installed\":true"; do
            echo "Still installing..."
            sleep 15
          done'
          curl -fsk "https://$APP_HOSTNAME/status.php"

      - name: Verify Nextcloud login page is served
        run: |
          # shellcheck disable=SC2016
          timeout 2m bash -c 'while ! curl -fskL "https://$APP_HOSTNAME/" -o /dev/null; do sleep 5; done'
          curl -fskL "https://$APP_HOSTNAME/" -o /dev/null -w "Nextcloud front page: %{http_code}\n"

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races a dump that is still being written.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -q "Database backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          db=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Database backup OK" | tail -1 | sed -E 's/.*Database backup OK: ([^ ]+) .*/\1/')
          echo "Database backup file: $db"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "gunzip -t '$db' && gunzip -c '$db' | head -5 | grep -qE 'PostgreSQL database dump'" && echo "Database backup valid: $db"
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -qE "Data backup (OK|FAILED)"; do echo "Waiting for the data archive..."; sleep 10; done'
          data=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the data archive failed"; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null" && echo "Data backup valid: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Seven scenarios against the live stack: required-env guard, backup
        # produced, readable, valid content, failure detected when the
        # database is down, restore genuinely replaces state, prune keeps
        # recent files. Same script a maintainer runs locally.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Wait for the Traefik dashboard to be ready
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -fsSLk --write-out "%{http_code}" --output /dev/null "https://$APP_TRAEFIK_HOSTNAME" | grep -E "200|401"; do
            echo "Waiting for the dashboard to be ready..."
            sleep 10
          done'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
